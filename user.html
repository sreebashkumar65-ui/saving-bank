<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Savings Bank | ইউজার প্যানেল</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Hind Siliguri', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .app-container { display: flex; min-height: 100vh; position: relative; z-index: 1; }
        .sidebar {
            width: 280px; background: rgba(15,23,42,0.95); backdrop-filter: blur(10px);
            color: white; padding: 28px 20px; position: fixed; height: 100vh;
            overflow-y: auto; z-index: 100; transition: 0.3s; box-shadow: 2px 0 20px rgba(0,0,0,0.1);
        }
        .sidebar::-webkit-scrollbar { width: 5px; }
        .sidebar::-webkit-scrollbar-track { background: #1e293b; }
        .sidebar::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
        .logo-area { display: flex; align-items: center; gap: 12px; padding-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 24px; }
        .logo-icon { width: 48px; height: 48px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 15px; display: flex; align-items: center; justify-content: center; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .logo-icon i { font-size: 24px; color: white; }
        .logo-text h2 { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-text p { font-size: 11px; color: #94a3b8; margin-top: 4px; }
        .logo-text .founder { font-size: 9px; color: #64748b; margin-top: 3px; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            border-radius: 12px; margin-bottom: 8px; cursor: pointer; color: #94a3b8;
            transition: 0.3s; position: relative; overflow: hidden;
        }
        .nav-item i { width: 22px; font-size: 18px; }
        .nav-item:hover { color: white; background: rgba(59,130,246,0.2); transform: translateX(5px); }
        .nav-item.active { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; box-shadow: 0 4px 15px rgba(59,130,246,0.3); }
        .logout-item { margin-top: 40px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
        .main-content { flex: 1; margin-left: 280px; padding: 28px 32px; }
        .header {
            background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 20px;
            padding: 20px 28px; margin-bottom: 28px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .header h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-info {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 8px 18px;
            border-radius: 50px;
            color: white;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-balance {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
        }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 24px; margin-bottom: 28px; }
        .stat-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 20px; padding: 24px; display: flex; align-items: center; gap: 20px; transition: 0.3s; cursor: pointer; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .stat-icon { width: 65px; height: 65px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 18px; display: flex; align-items: center; justify-content: center; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .stat-icon i { font-size: 32px; color: white; }
        .stat-info h3 { font-size: 14px; color: #64748b; margin-bottom: 8px; }
        .stat-info h2 { font-size: 36px; font-weight: 700; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .content-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 20px; padding: 28px; margin-bottom: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid #f1f5f9; flex-wrap: wrap; gap: 15px; }
        .card-header h3 { font-size: 20px; color: #1e293b; }
        .btn-primary, .btn-payment { border: none; padding: 12px 24px; border-radius: 12px; font-size: 14px; cursor: pointer; font-weight: 600; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-payment { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; color: #1e293b; margin-bottom: 8px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 14px; }
        .profile-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); gap: 20px; }
        .info-item { background: #f8fafc; padding: 15px 20px; border-radius: 15px; border-left: 4px solid #667eea; }
        .info-item label { font-size: 12px; color: #64748b; display: block; margin-bottom: 5px; }
        .info-item p { font-size: 18px; font-weight: 600; color: #1e293b; }
        .notice-item { background: #f8fafc; padding: 15px 20px; border-radius: 15px; margin-bottom: 12px; border-left: 4px solid #f59e0b; }
        .notice-item .notice-date { font-size: 11px; color: #94a3b8; margin-bottom: 5px; }
        .notice-item .notice-message { font-size: 14px; color: #1e293b; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 32px; border-radius: 24px; width: 90%; max-width: 450px; }
        .modal-buttons { display: flex; gap: 12px; margin-top: 24px; }
        .modal-buttons button { flex:1; padding:12px; border-radius:12px; border:none; cursor:pointer; }
        .confirm-btn { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .cancel-btn { background: #e2e8f0; color: #1e293b; }
        .alert { padding: 12px 16px; border-radius: 12px; margin-bottom: 20px; display: none; align-items: center; gap: 10px; }
        .alert.error { background: #fee2e2; border-left: 4px solid #ef4444; color: #991b1b; display: flex; }
        .alert.success { background: #dcfce7; border-left: 4px solid #10b981; color: #065f46; display: flex; }
        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            justify-content: space-around;
            z-index: 1000;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 11px;
        }
        .mobile-nav-item i { font-size: 20px; }
        .mobile-nav-item.active { color: #3b82f6; }
        @media (max-width: 768px) {
            .sidebar { display: none !important; }
            .main-content { margin-left: 0 !important; padding: 20px 16px 80px 16px !important; }
            .mobile-bottom-nav { display: flex; }
            .stats-grid { grid-template-columns: 1fr; gap: 15px; }
            .stat-card { padding: 15px; }
            .stat-icon { width: 50px; height: 50px; }
            .stat-icon i { font-size: 24px; }
            .stat-info h2 { font-size: 24px; }
            .card-header { flex-direction: column; align-items: flex-start; }
            .profile-info { grid-template-columns: 1fr; }
            .header h1 { font-size: 18px; }
            .user-info { font-size: 12px; padding: 6px 12px; gap: 8px; }
            .user-balance { font-size: 12px; padding: 2px 8px; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="sidebar">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-building-columns"></i></div>
            <div class="logo-text">
                <h2>Savings Bank</h2>
                <p>ইউজার প্যানেল</p>
                <div class="founder">Founder by Sreebash Kumar</div>
            </div>
        </div>
        <div class="nav-item active" data-section="dashboard"><i class="fas fa-tachometer-alt"></i><span>ড্যাশবোর্ড</span></div>
        <div class="nav-item" data-section="profile"><i class="fas fa-user-circle"></i><span>প্রোফাইল</span></div>
        <div class="nav-item" data-section="payment"><i class="fas fa-credit-card"></i><span>পেমেন্ট</span></div>
        <div class="nav-item" data-section="notice"><i class="fas fa-bell"></i><span>নোটিশ</span></div>
        <div class="nav-item" data-section="tour"><i class="fas fa-umbrella-beach"></i><span>ট্যুর প্ল্যান</span></div>
        <div class="nav-item logout-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>লগআউট</span></div>
    </div>
    <div class="main-content">
        <div class="header">
            <h1><i class="fas fa-building-columns"></i> Savings Bank</h1>
            <div class="user-info">
                <i class="fas fa-user"></i>
                <span id="userName">ইউজার</span>
                <span id="userBalance" class="user-balance">৳ 0</span>
            </div>
        </div>
        <div id="alertMessage" class="alert"></div>
        <!-- ড্যাশবোর্ড – অ্যাকাউন্ট স্ট্যাটাস কার্ড সরানো হয়েছে -->
        <div id="dashboardSection" class="content-section">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-money-bill-wave"></i></div><div class="stat-info"><h3>মোট জমা</h3><h2>৳ <span id="totalDeposit">0</span></h2></div></div>
                <div class="stat-card"><div class="stat-icon"><i class="fas fa-layer-group"></i></div><div class="stat-info"><h3>আপনার প্ল্যান</h3><h2 id="userDept">-</h2></div></div>
            </div>
            <div class="content-card"><div class="card-header"><h3><i class="fas fa-bullhorn"></i> সর্বশেষ নোটিশ</h3><button class="btn-primary" onclick="showSection('notice')">সব নোটিশ দেখুন</button></div><div id="latestNotices"></div></div>
            <div class="content-card"><div class="card-header"><h3><i class="fas fa-umbrella-beach"></i> চলমান ট্যুর প্ল্যান</h3><button class="btn-primary" onclick="showSection('tour')">সব ট্যুর দেখুন</button></div><div id="latestTours"></div></div>
        </div>
        <!-- প্রোফাইল -->
        <div id="profileSection" class="content-section" style="display:none;"><div class="content-card"><div class="card-header"><h3><i class="fas fa-user-circle"></i> আপনার প্রোফাইল</h3><button class="btn-primary" onclick="openEditProfileModal()">✏️ প্রোফাইল এডিট</button></div><div class="profile-info" id="profileInfo"></div></div></div>
        <!-- পেমেন্ট -->
        <div id="paymentSection" class="content-section" style="display:none;"><div class="content-card"><div class="card-header"><h3><i class="fas fa-credit-card"></i> পেমেন্ট করুন</h3></div><form id="paymentForm"><div class="form-group"><label>💰 পরিমাণ (টাকা)</label><input type="number" id="paymentAmount" placeholder="যেমন: 500" required></div><div class="form-group"><label>📱 বিকাশ/নগদ নম্বর</label><input type="tel" id="paymentNumber" placeholder="01XXXXXXXXX" maxlength="11" required></div><div class="form-group"><label>📝 ট্রানজেকশন আইডি</label><input type="text" id="transactionId" placeholder="TXID..." required></div><button type="submit" class="btn-payment"><i class="fas fa-paper-plane"></i> পেমেন্ট সাবমিট করুন</button></form></div><div class="content-card"><div class="card-header"><h3><i class="fas fa-history"></i> পেমেন্ট হিস্টোরি</h3></div><div id="paymentHistory"></div></div></div>
        <!-- নোটিশ -->
        <div id="noticeSection" class="content-section" style="display:none;"><div class="content-card"><div class="card-header"><h3><i class="fas fa-bell"></i> সকল নোটিশ</h3></div><div id="allNotices"></div></div></div>
        <!-- ট্যুর -->
        <div id="tourSection" class="content-section" style="display:none;"><div class="content-card"><div class="card-header"><h3><i class="fas fa-umbrella-beach"></i> ট্যুর প্ল্যান সমূহ</h3></div><div id="tourPlansList"></div></div></div>
    </div>
</div>
<!-- মোবাইল নেভিগেশন -->
<div class="mobile-bottom-nav" id="mobileBottomNav"></div>
<!-- প্রোফাইল এডিট মোডাল -->
<div id="editProfileModal" class="modal"><div class="modal-content"><h3>✏️ প্রোফাইল এডিট</h3><div class="form-group"><label>পূর্ণ নাম</label><input type="text" id="editName" placeholder="আপনার নাম"></div><div class="form-group"><label>পাসওয়ার্ড</label><input type="password" id="editPassword" placeholder="নতুন পাসওয়ার্ড"></div><div class="modal-buttons"><button class="confirm-btn" onclick="saveProfileEdit()">সেভ করুন</button><button class="cancel-btn" onclick="closeEditModal()">বাতিল করুন</button></div></div></div>

<script>
let currentUser = null, allUsers = [], allNotices = [], tourPlans = [], paymentHistory = [];
let loggedUser = JSON.parse(localStorage.getItem("loggedUser"));
if(!loggedUser || loggedUser.role !== "user") window.location.replace("index.html");

function showAlert(msg,type){ let d=document.getElementById("alertMessage"); d.innerHTML=`<i class="fas ${type==='error'?'fa-exclamation-circle':'fa-check-circle'}"></i> ${msg}`; d.className=`alert ${type}`; setTimeout(()=>d.style.display='none',3000); }
function loadAllData(){
    let stored=localStorage.getItem("users"); if(stored) allUsers=JSON.parse(stored);
    currentUser=allUsers.find(u=>u.phone===loggedUser.phone);
    if(currentUser) localStorage.setItem("loggedUser",JSON.stringify(currentUser));
    allNotices=JSON.parse(localStorage.getItem("globalNotices"))||[];
    tourPlans=JSON.parse(localStorage.getItem("tourPlansList"))||[];
    paymentHistory=JSON.parse(localStorage.getItem("userPayments"))||[];
    renderDashboard(); renderProfile(); renderNotices(); renderTourPlans(); renderPaymentHistory();
}
function renderDashboard(){
    document.getElementById("userName").innerText=currentUser?.name||"ইউজার";
    document.getElementById("userBalance").innerText=`৳ ${currentUser?.deposit||0}`;
    document.getElementById("totalDeposit").innerText=currentUser?.deposit||0;
    document.getElementById("userDept").innerText=currentUser?.dept||"-";
    let userNotices=allNotices.filter(n=>n.phone==="all"||n.phone===currentUser?.phone);
    let latest=userNotices.slice(-3).reverse();
    let nh=latest.length?latest.map(n=>`<div class="notice-item"><div class="notice-date"><i class="far fa-clock"></i> ${n.date}</div><div class="notice-message">${n.message}</div></div>`).join(''):'<div style="text-align:center;padding:20px;">📭 কোনো নোটিশ নেই</div>';
    document.getElementById("latestNotices").innerHTML=nh;
    let lt=tourPlans.slice(-3).reverse();
    let th=lt.length?lt.map(t=>`<div class="notice-item" style="border-left-color:#10b981;"><div class="notice-date"><i class="fas fa-map-marker-alt"></i> ${t.dest} | <i class="far fa-calendar"></i> ${t.date}</div><div class="notice-message">⏱️ সময়: ${t.duration||'নির্ধারিত নয়'} | 💰 খরচ: ${t.cost||'নির্ধারিত নয়'} | 👥 সীমা: ${t.limit||'নির্ধারিত নয়'}</div></div>`).join(''):'<div style="text-align:center;padding:20px;">🏝️ কোনো ট্যুর প্ল্যান নেই</div>';
    document.getElementById("latestTours").innerHTML=th;
}
function renderProfile(){
    let html=`<div class="info-item"><label>👤 নাম</label><p>${currentUser?.name||''}</p></div><div class="info-item"><label>📞 মোবাইল নম্বর</label><p>${currentUser?.phone||''}</p></div><div class="info-item"><label>📂 বিভাগ</label><p>${currentUser?.dept||''}</p></div><div class="info-item"><label>💰 মোট জমা</label><p>৳ ${currentUser?.deposit||0}</p></div><div class="info-item"><label>📅 রেজিস্ট্রেশন তারিখ</label><p>${currentUser?.registerDate?new Date(currentUser.registerDate).toLocaleDateString('bn-BD'):'নির্ধারিত নয়'}</p></div></div>`;
    document.getElementById("profileInfo").innerHTML=html;
}
function renderNotices(){
    let userNotices=allNotices.filter(n=>n.phone==="all"||n.phone===currentUser?.phone);
    if(!userNotices.length){ document.getElementById("allNotices").innerHTML="<div style='text-align:center;padding:40px;'>📭 কোনো নোটিশ নেই</div>"; return; }
    let html=""; userNotices.reverse().forEach(n=>{html+=`<div class="notice-item"><div class="notice-date"><i class="far fa-clock"></i> ${n.date}</div><div class="notice-message">${n.message}</div></div>`;});
    document.getElementById("allNotices").innerHTML=html;
}
function renderTourPlans(){
    if(!tourPlans.length){ document.getElementById("tourPlansList").innerHTML="<div style='text-align:center;padding:40px;'>🏝️ কোনো ট্যুর প্ল্যান নেই</div>"; return; }
    let html=""; tourPlans.reverse().forEach(t=>{html+=`<div class="notice-item" style="border-left-color:#10b981;margin-bottom:15px;"><div class="notice-date"><i class="fas fa-map-marker-alt"></i> <strong>${t.dest}</strong> | <i class="far fa-calendar"></i> ${t.date}</div><div class="notice-message">⏱️ সময়কাল: ${t.duration||'নির্ধারিত নয়'}<br>💰 খরচ: ${t.cost||'নির্ধারিত নয়'} টাকা<br>👥 সদস্য সীমা: ${t.limit||'নির্ধারিত নয়'} জন</div></div>`;});
    document.getElementById("tourPlansList").innerHTML=html;
}
function renderPaymentHistory(){
    let userPayments=paymentHistory.filter(p=>p.phone===currentUser?.phone);
    if(!userPayments.length){ document.getElementById("paymentHistory").innerHTML="<div style='text-align:center;padding:40px;'>📭 কোনো পেমেন্ট ইতিহাস নেই</div>"; return; }
    let html=`<table><thead><tr><th>তারিখ</th><th>পরিমাণ</th><th>ট্রানজেকশন আইডি</th><th>স্ট্যাটাস</th></tr></thead><tbody>`;
    userPayments.reverse().forEach(p=>{html+=`<tr><td>${p.date||new Date().toLocaleString()}</td><td>৳ ${p.amount}</td><td>${p.transactionId}</td><td>${p.status==='approved'?'✅ অনুমোদিত':'⏳ পেন্ডিং'}</td></tr>`;});
    html+=`</tbody></table>`;
    document.getElementById("paymentHistory").innerHTML=html;
}
document.getElementById("paymentForm")?.addEventListener("submit",function(e){
    e.preventDefault();
    let amount=document.getElementById("paymentAmount").value;
    let paymentNumber=document.getElementById("paymentNumber").value.trim();
    let transactionId=document.getElementById("transactionId").value.trim();
    if(!amount||amount<50){ showAlert("সঠিক পরিমাণ দিন (ন্যূনতম ৫০ টাকা)!","error"); return; }
    if(!paymentNumber||paymentNumber.length!==11){ showAlert("সঠিক মোবাইল নম্বর দিন!","error"); return; }
    if(!transactionId){ showAlert("ট্রানজেকশন আইডি দিন!","error"); return; }
    let paymentRequest={ name:currentUser.name, phone:currentUser.phone, section:currentUser.dept, amount:parseInt(amount), transactionId, paymentNumber, date:new Date().toLocaleString(), status:"pending" };
    let allPayments=JSON.parse(localStorage.getItem("payments"))||[];
    allPayments.push(paymentRequest);
    localStorage.setItem("payments",JSON.stringify(allPayments));
    let userPayments=JSON.parse(localStorage.getItem("userPayments"))||[];
    userPayments.push({ phone:currentUser.phone, amount:parseInt(amount), transactionId, date:new Date().toLocaleString(), status:"pending" });
    localStorage.setItem("userPayments",JSON.stringify(userPayments));
    showAlert("পেমেন্ট রিকোয়েস্ট সফল! অ্যাডমিন অনুমোদন দিলে জমা যোগ হবে।","success");
    document.getElementById("paymentAmount").value="";
    document.getElementById("paymentNumber").value="";
    document.getElementById("transactionId").value="";
    renderPaymentHistory();
});
function openEditProfileModal(){ document.getElementById("editName").value=currentUser?.name||""; document.getElementById("editPassword").value=""; document.getElementById("editProfileModal").style.display="flex"; }
function closeEditModal(){ document.getElementById("editProfileModal").style.display="none"; }
function saveProfileEdit(){
    let newName=document.getElementById("editName").value.trim();
    let newPass=document.getElementById("editPassword").value.trim();
    if(newName) currentUser.name=newName;
    if(newPass&&newPass.length>=4) currentUser.pass=newPass;
    else if(newPass&&newPass.length<4){ showAlert("পাসওয়ার্ড কমপক্ষে ৪ অক্ষরের হতে হবে!","error"); return; }
    let idx=allUsers.findIndex(u=>u.phone===currentUser.phone);
    if(idx!==-1){ allUsers[idx]=currentUser; localStorage.setItem("users",JSON.stringify(allUsers)); localStorage.setItem("loggedUser",JSON.stringify(currentUser)); }
    showAlert("প্রোফাইল আপডেট হয়েছে!","success");
    renderProfile(); renderDashboard(); closeEditModal();
}
function showSection(section){
    ["dashboardSection","profileSection","paymentSection","noticeSection","tourSection"].forEach(s=>{let el=document.getElementById(s); if(el) el.style.display="none";});
    document.getElementById(section+"Section").style.display="block";
    document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
    document.querySelectorAll(`.nav-item[data-section="${section}"]`).forEach(n=>n.classList.add("active"));
    document.querySelectorAll(".mobile-nav-item").forEach(n=>n.classList.remove("active"));
    let activeMobile=document.querySelector(`.mobile-nav-item[data-section="${section}"]`);
    if(activeMobile) activeMobile.classList.add("active");
    if(section==="payment") renderPaymentHistory();
    if(section==="notice") renderNotices();
    if(section==="tour") renderTourPlans();
}
function initMobileNav(){
    let nav=document.getElementById("mobileBottomNav");
    if(!nav) return;
    let items=["dashboard","profile","payment","notice","tour"];
    let icons=["tachometer-alt","user-circle","credit-card","bell","umbrella-beach"];
    let labels=["হোম","প্রোফাইল","পেমেন্ট","নোটিশ","ট্যুর"];
    nav.innerHTML="";
    items.forEach((item,idx)=>{
        let div=document.createElement("div");
        div.className="mobile-nav-item";
        div.setAttribute("data-section",item);
        div.innerHTML=`<i class="fas fa-${icons[idx]}"></i><span>${labels[idx]}</span>`;
        div.onclick=()=>showSection(item);
        nav.appendChild(div);
    });
}
function logout(){ localStorage.removeItem("loggedUser"); window.location.replace("index.html"); }
document.getElementById("paymentNumber")?.addEventListener("input",function(e){ this.value=this.value.replace(/[^0-9]/g,'').slice(0,11); });
window.onclick=function(e){ let modal=document.getElementById("editProfileModal"); if(e.target===modal) closeEditModal(); };
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>{ initMobileNav(); loadAllData(); });
else { initMobileNav(); loadAllData(); }
</script>
