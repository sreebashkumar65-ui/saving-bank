<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Bank | রেজিস্ট্রেশন</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .animated-bg .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            bottom: -200px;
            right: -100px;
            animation-delay: 5s;
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            top: 50%;
            left: 50%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            z-index: 1;
            padding: 20px;
        }

        /* Card Styles */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            animation: slideInUp 0.6s ease;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .card-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 30px 30px;
            text-align: center;
            position: relative;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .logo-icon i {
            font-size: 35px;
            color: white;
        }

        .card-header h2 {
            color: white;
            font-size: 26px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .card-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
        }
        
        .founder-text {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 8px;
        }

        /* Body */
        .card-body {
            padding: 35px 35px;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group i:first-child {
            position: absolute;
            left: 16px;
            color: #94a3b8;
            font-size: 18px;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 13px 16px 13px 48px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 14px;
            font-family: 'Hind Siliguri', sans-serif;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group select {
            padding: 13px 16px 13px 48px;
            cursor: pointer;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-group input:focus + i, .form-group select:focus + i {
            color: #667eea;
        }

        /* Password Toggle */
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            transition: color 0.3s ease;
            z-index: 2;
        }

        .password-toggle:hover {
            color: #667eea;
        }

        /* Button */
        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Hind Siliguri', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }

        .btn-register::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-register:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        /* Footer */
        .card-footer {
            padding: 20px 35px 35px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
        }

        .card-footer p {
            color: #64748b;
            font-size: 14px;
        }

        .card-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .card-footer a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* Alert Messages */
        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: slideInDown 0.3s ease;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.error {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
            color: #991b1b;
            display: flex;
        }

        .alert.success {
            background: #dcfce7;
            border-left: 4px solid #10b981;
            color: #065f46;
            display: flex;
        }

        .alert i {
            font-size: 18px;
        }

        /* Loading Spinner */
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card-body {
                padding: 25px 20px;
            }
            .card-footer {
                padding: 20px 20px 30px;
            }
            .form-group input, .form-group select {
                padding: 12px 16px 12px 45px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
<div class="animated-bg">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
</div>

<div class="container">
    <div class="card">
        <div class="card-header">
            <div class="logo-icon">
                <i class="fas fa-building-columns"></i>
            </div>
            <h2>Savings Bank</h2>
            <p>নতুন অ্যাকাউন্ট তৈরি করুন</p>
            <div class="founder-text">Founder by Sreebash Kumar</div>
        </div>
        
        <div class="card-body">
            <div id="alertMessage" class="alert"></div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> পূর্ণ নাম</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="regName" placeholder="আপনার পূর্ণ নাম" autocomplete="off" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-phone-alt"></i> মোবাইল নম্বর</label>
                    <div class="input-group">
                        <i class="fas fa-mobile-alt"></i>
                        <input type="tel" id="regPhone" placeholder="01XXXXXXXXX" maxlength="11" autocomplete="off" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-layer-group"></i> বিভাগ নির্বাচন</label>
                    <div class="input-group">
                        <i class="fas fa-tag"></i>
                        <select id="regDept" required>
                            <option value="ট্যুর-শেয়ার">🏝️ ট্যুর-শেয়ার</option>
                            <option value="চিকিৎসা-শেয়ার">🏥 চিকিৎসা-শেয়ার</option>
                            <option value="বাৎসরিক-শেয়ার">📆 বাৎসরিক-শেয়ার</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> পাসওয়ার্ড</label>
                    <div class="input-group">
                        <i class="fas fa-key"></i>
                        <input type="password" id="regPassword" placeholder="পাসওয়ার্ড (৪+ অক্ষর)" required>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('regPassword', this)"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-check-circle"></i> পাসওয়ার্ড নিশ্চিত করুন</label>
                    <div class="input-group">
                        <i class="fas fa-check"></i>
                        <input type="password" id="regConfirmPassword" placeholder="আবার পাসওয়ার্ড দিন" required>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('regConfirmPassword', this)"></i>
                    </div>
                </div>
                
                <button type="submit" class="btn-register">
                    <i class="fas fa-user-plus"></i> রেজিস্ট্রেশন করুন
                </button>
            </form>
        </div>
        
        <div class="card-footer">
            <p>ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="index.html">লগইন করুন</a></p>
        </div>
    </div>
</div>

<div class="loading" id="loading">
    <div class="spinner"></div>
</div>

<script>
    // Toggle password visibility
    function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    // Show alert message
    function showAlert(message, type) {
        const alertDiv = document.getElementById('alertMessage');
        alertDiv.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${message}`;
        alertDiv.className = `alert ${type}`;
        
        setTimeout(() => {
            alertDiv.style.display = 'none';
        }, 3000);
    }

    // Validate Bangladesh mobile number
    function validateBangladeshPhone(phone) {
        const phoneRegex = /^01[3-9]\d{8}$/;
        return phoneRegex.test(phone);
    }

    // Phone input - only numbers
    document.getElementById('regPhone').addEventListener('input', function(e) {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 11);
    });

    // Registration form submit
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('regName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const dept = document.getElementById('regDept').value;
        const password = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('regConfirmPassword').value;
        
        // Validation
        if (!name || !phone || !password || !confirmPassword) {
            showAlert('সব ঘর পূরণ করুন!', 'error');
            return;
        }
        
        // Correct phone validation
        if (!validateBangladeshPhone(phone)) {
            showAlert('সঠিক বাংলাদেশি মোবাইল নম্বর দিন (01XXXXXXXXX)!', 'error');
            return;
        }
        
        if (password !== confirmPassword) {
            showAlert('পাসওয়ার্ড দুটি মিলছে না!', 'error');
            return;
        }
        
        if (password.length < 4) {
            showAlert('পাসওয়ার্ড কমপক্ষে ৪ অক্ষরের হতে হবে!', 'error');
            return;
        }
        
        // Show loading
        document.getElementById('loading').style.display = 'flex';
        
        // Small delay for loading effect
        setTimeout(() => {
            // Get existing users
            let users = JSON.parse(localStorage.getItem('users')) || [];
            
            // Check if phone already exists
            if (users.find(u => u.phone === phone)) {
                showAlert('এই মোবাইল নম্বরটি already রেজিস্ট্রেশন করা আছে!', 'error');
                document.getElementById('loading').style.display = 'none';
                return;
            }
            
            // Create new user object with all required fields
            const newUser = {
                id: Date.now(),
                name: name,
                phone: phone,
                dept: dept,
                pass: password,
                deposit: 0,
                role: 'user',
                status: 'active',
                registerDate: new Date().toISOString()
            };
            
            // Add to users array
            users.push(newUser);
            
            // Save to localStorage
            localStorage.setItem('users', JSON.stringify(users));
            
            // Debug: Check if saved properly
            console.log('Registration successful!');
            console.log('Total users:', JSON.parse(localStorage.getItem('users')));
            console.log('New user:', newUser);
            
            // Show success message
            showAlert('রেজিস্ট্রেশন সফল! লগইন পেজে রিডাইরেক্ট হচ্ছে...', 'success');
            
            // Redirect to login page after 2 seconds
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
            
        }, 1000);
    });
    
    // Check if already logged in (optional)
    const loggedUser = JSON.parse(localStorage.getItem('loggedUser'));
    if (loggedUser) {
        if (loggedUser.role === 'admin') {
            window.location.href = 'admin.html';
        } else if (loggedUser.role === 'user') {
            window.location.href = 'user.html';
        }
    }
</script>
</body>
</html>
