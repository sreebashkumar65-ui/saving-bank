<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Bank | মডারেটর প্যানেল</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 28px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 { font-size: 24px; color: #1e293b; }
        .user-info { background: linear-gradient(135deg, #667eea, #764ba2); padding: 8px 18px; border-radius: 50px; color: white; }
        .founder-text { text-align: center; font-size: 11px; color: #64748b; margin-top: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-bottom: 28px; }
        .stat-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s ease;
        }
        .stat-icon { width: 65px; height: 65px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 18px; display: flex; align-items: center; justify-content: center; }
        .stat-icon i { font-size: 32px; color: white; }
        .stat-info h3 { font-size: 14px; color: #64748b; margin-bottom: 8px; }
        .stat-info h2 { font-size: 32px; color: #1e293b; }
        .content-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 28px;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid #f1f5f9; flex-wrap: wrap; gap: 15px; }
        .card-header h3 { font-size: 20px; color: #1e293b; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 14px 12px; color: #64748b; border-bottom: 2px solid #e2e8f0; }
        td { padding: 14px 12px; color: #1e293b; border-bottom: 1px solid #f1f5f9; }
        .btn-edit, .btn-delete, .btn-primary {
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-edit { background: linear-gradient(135deg, #f59e0b, #f97316); color: white; margin-right: 8px; }
        .btn-delete { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 10px 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #1e293b; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
        }
        .modal-buttons { display: flex; gap: 12px; margin-top: 24px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 12px; border: none; cursor: pointer; }
        .save-btn { background: #10b981; color: white; }
        .cancel-btn { background: #e2e8f0; color: #1e293b; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; }
        @media (max-width: 768px) { .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-building-columns"></i> Savings Bank মডারেটর প্যানেল</h1>
        <div class="user-info"><i class="fas fa-user"></i> <span id="modName"></span></div>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div id="usersSection" class="content-card">
        <div class="card-header"><h3><i class="fas fa-users"></i> ইউজার লিস্ট</h3></div>
        <div id="usersList" style="overflow-x: auto;"></div>
    </div>

    <div id="addUserSection" class="content-card" style="display:none;">
        <div class="card-header"><h3><i class="fas fa-user-plus"></i> নতুন ইউজার যোগ করুন</h3></div>
        <div class="form-group"><label>পূর্ণ নাম</label><input type="text" id="newName" placeholder="নাম লিখুন"></div>
        <div class="form-group"><label>মোবাইল নম্বর</label><input type="text" id="newPhone" placeholder="01XXXXXXXXX" maxlength="11"></div>
        <div class="form-group"><label>বিভাগ</label><select id="newDept"><option value="ট্যুর-শেয়ার">ট্যুর-শেয়ার</option><option value="চিকিৎসা-শেয়ার">চিকিৎসা-শেয়ার</option><option value="বাৎসরিক-শেয়ার">বাৎসরিক-শেয়ার</option></select></div>
        <div class="form-group"><label>পাসওয়ার্ড</label><input type="password" id="newPass" placeholder="পাসওয়ার্ড"></div>
        <button class="btn-primary" onclick="addNewUser()">ইউজার অ্যাড করুন</button>
    </div>

    <div id="paymentsSection" class="content-card" style="display:none;">
        <div class="card-header"><h3><i class="fas fa-credit-card"></i> পেমেন্ট রিকোয়েস্ট</h3></div>
        <div id="paymentsList"></div>
    </div>

    <div id="noticeSection" class="content-card" style="display:none;">
        <div class="card-header"><h3><i class="fas fa-bullhorn"></i> নোটিশ পাবলিশ করুন</h3></div>
        <div class="form-group"><label>মোবাইল (ঐচ্ছিক)</label><input type="text" id="noticePhone" placeholder="মোবাইল নম্বর" maxlength="11"></div>
        <div class="form-group"><label>বার্তা</label><textarea id="noticeMsg" rows="4" placeholder="বার্তা লিখুন..."></textarea></div>
        <button class="btn-primary" onclick="publishNotice()">পাবলিশ করুন</button>
        
        <div style="margin-top: 30px;">
            <div class="card-header"><h3><i class="fas fa-list"></i> নোটিশ সমূহ</h3></div>
            <div id="noticesList"></div>
        </div>
    </div>

    <div id="tourSection" class="content-card" style="display:none;">
        <div class="card-header"><h3><i class="fas fa-umbrella-beach"></i> ট্যুর প্ল্যান সেটআপ</h3></div>
        <div class="form-group"><label>📍 গন্তব্য</label><input type="text" id="tourDest" placeholder="যেখানে যাবেন"></div>
        <div class="form-group"><label>📅 তারিখ</label><input type="text" id="tourDate" placeholder="যাওয়ার তারিখ"></div>
        <div class="form-group"><label>⏱️ সময়কাল</label><input type="text" id="tourDuration" placeholder="কত দিন"></div>
        <div class="form-group"><label>💰 খরচ</label><input type="text" id="tourCost" placeholder="প্রতি জন খরচ"></div>
        <div class="form-group"><label>👥 সদস্য সংখ্যা</label><input type="text" id="tourLimit" placeholder="সর্বোচ্চ কত জন"></div>
        <button class="btn-primary" onclick="saveTourPlan()">সেভ করুন</button>
        
        <div style="margin-top: 30px;">
            <div class="card-header"><h3><i class="fas fa-list"></i> ট্যুর প্ল্যান সমূহ</h3></div>
            <div id="tourPlansList"></div>
        </div>
    </div>

    <div class="founder-text">Founder by Sreebash Kumar</div>

    <div style="text-align: center; margin-top: 20px;">
        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> লগআউট</button>
    </div>
</div>

<!-- নোটিশ এডিট মোডাল -->
<div id="editNoticeModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom:20px;">✏️ নোটিশ এডিট করুন</h3>
        <input type="hidden" id="editNoticeIndex">
        <div class="form-group"><label>📱 মোবাইল নম্বর (ঐচ্ছিক)</label><input type="text" id="editNoticePhone" placeholder="মোবাইল নম্বর" maxlength="11"></div>
        <div class="form-group"><label>📝 নোটিশ বার্তা</label><textarea id="editNoticeMsg" rows="4" placeholder="বার্তা লিখুন..."></textarea></div>
        <div class="modal-buttons"><button class="save-btn" onclick="saveEditNotice()">সেভ করুন</button><button class="cancel-btn" onclick="closeNoticeModal()">বাতিল করুন</button></div>
    </div>
</div>

<!-- ট্যুর প্ল্যান এডিট মোডাল -->
<div id="editTourModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom:20px;">✏️ ট্যুর প্ল্যান এডিট করুন</h3>
        <input type="hidden" id="editTourIndex">
        <div class="form-group"><label>📍 গন্তব্য</label><input type="text" id="editTourDest"></div>
        <div class="form-group"><label>📅 তারিখ</label><input type="text" id="editTourDate"></div>
        <div class="form-group"><label>⏱️ সময়কাল</label><input type="text" id="editTourDuration"></div>
        <div class="form-group"><label>💰 খরচ</label><input type="text" id="editTourCost"></div>
        <div class="form-group"><label>👥 সদস্য সংখ্যা</label><input type="text" id="editTourLimit"></div>
        <div class="modal-buttons"><button class="save-btn" onclick="saveEditTour()">সেভ করুন</button><button class="cancel-btn" onclick="closeTourModal()">বাতিল করুন</button></div>
    </div>
</div>

<script>
let currentModerator = null;
let perms = {};

// ============ এক্টিভিটি লগ ফাংশন (মডারেটরের কাজ সেভ করার জন্য) ============
function addActivityLog(action, details) {
    if(!currentModerator) return;
    
    let logs = JSON.parse(localStorage.getItem("moderatorActivityLog")) || [];
    logs.unshift({
        id: Date.now(),
        moderator: currentModerator.username,
        action: action,
        details: details,
        time: new Date().toLocaleString()
    });
    // সর্বশেষ 200 লগ রাখা
    if(logs.length > 200) logs = logs.slice(0, 200);
    localStorage.setItem("moderatorActivityLog", JSON.stringify(logs));
}

function loadData() {
    currentModerator = JSON.parse(localStorage.getItem("loggedModerator"));
    if(!currentModerator) { window.location.href = "moderator_login.html"; return; }
    
    perms = currentModerator.perms || {};
    document.getElementById("modName").innerText = currentModerator.username;
    
    let sections = [
        { id: "usersSection", perm: "accessUsers", name: "ইউজার লিস্ট" },
        { id: "addUserSection", perm: "accessAddUser", name: "নতুন ইউজার" },
        { id: "paymentsSection", perm: "accessPayments", name: "পেমেন্ট" },
        { id: "noticeSection", perm: "accessNotice", name: "নোটিশ" },
        { id: "tourSection", perm: "accessTour", name: "ট্যুর" }
    ];
    
    sections.forEach(s => { 
        if(perms[s.perm]) { 
            document.getElementById(s.id).style.display = "block"; 
        } else { 
            document.getElementById(s.id).style.display = "none"; 
        } 
    });
    
    let statsHtml = '';
    if(perms.accessUsers) statsHtml += `<div class="stat-card"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-info"><h3>মোট ইউজার</h3><h2 id="totalUsers">0</h2></div></div>`;
    if(perms.accessPayments) statsHtml += `<div class="stat-card"><div class="stat-icon"><i class="fas fa-hourglass-half"></i></div><div class="stat-info"><h3>পেন্ডিং পেমেন্ট</h3><h2 id="pendingCount">0</h2></div></div>`;
    document.getElementById("statsGrid").innerHTML = statsHtml || "<div class='stat-card'><div class='stat-info'><h3>স্বাগতম!</h3><p>আপনার কাছে যেই পারমিশন আছে সেগুলো দেখতে পারবেন।</p></div></div>";
    
    if(perms.accessUsers) { renderUsersList(); updateStats(); }
    if(perms.accessPayments) renderPaymentsList();
    if(perms.accessNotice) renderNoticesList();
    if(perms.accessTour) renderTourPlans();
}

function validatePhone(phone) { return /^01[3-9]\d{8}$/.test(phone); }

function updateStats() {
    let users = JSON.parse(localStorage.getItem("users")) || [];
    let activeCount = users.filter(u => u.role !== 'admin').length;
    let payments = JSON.parse(localStorage.getItem("payments")) || [];
    if(document.getElementById("totalUsers")) document.getElementById("totalUsers").innerText = activeCount;
    if(document.getElementById("pendingCount")) document.getElementById("pendingCount").innerText = payments.length;
}

function renderUsersList() {
    let users = JSON.parse(localStorage.getItem("users")) || [];
    let filtered = users.filter(u => u.role !== 'admin');
    if(filtered.length === 0) {
        document.getElementById("usersList").innerHTML = "<p style='text-align:center; padding:20px;'>কোন ইউজার নেই</p>";
        return;
    }
    let html = `</td><thead><tr><th>নাম</th><th>মোবাইল</th><th>বিভাগ</th><th>জমা</th></tr></thead><tbody>`;
    filtered.forEach(u => { html += `<tr><td>${u.name}</td><td>${u.phone}</td><td>${u.dept}</td><td>৳ ${u.deposit || 0}</td></tr>`; });
    html += `</tbody></td>`;
    document.getElementById("usersList").innerHTML = html;
}

function renderPaymentsList() {
    let payments = JSON.parse(localStorage.getItem("payments")) || [];
    if(payments.length === 0) { document.getElementById("paymentsList").innerHTML = "<p style='text-align:center; padding:20px;'>কোন পেমেন্ট রিকোয়েস্ট নেই</p>"; return; }
    let html = `</table><thead><tr><th>নাম</th><th>মোবাইল</th><th>টাকা</th><th>ট্রানজেকশন আইডি</th></tr></thead><tbody>`;
    payments.forEach(p => { html += `<tr><td>${p.name}</td><td>${p.phone}</td><td>৳ ${p.amount}</td><td>${p.transactionId || 'N/A'}</td></tr>`; });
    html += `</tbody></table>`;
    document.getElementById("paymentsList").innerHTML = html;
}

// ============ নোটিশ ফাংশন (লগ সহ) ============
function renderNoticesList() {
    let container = document.getElementById("noticesList");
    if(!container) return;
    
    let allNotices = JSON.parse(localStorage.getItem("globalNotices")) || [];
    
    if(allNotices.length === 0) {
        container.innerHTML = "<p style='text-align:center; padding:20px;'>কোন নোটিশ নেই</p>";
        return;
    }
    
    let html = `<table style="width:100%">
        <thead>
            <tr>
                <th>তারিখ</th>
                <th>প্রেরক</th>
                <th>মোবাইল</th>
                <th>বার্তা</th>
                <th>অ্যাকশন</th>
            </tr>
        </thead>
        <tbody>`;
    
    allNotices.slice().reverse().forEach((notice, idx) => {
        let originalIdx = allNotices.length - 1 - idx;
        html += `<tr>
            <td>${notice.date || 'N/A'}</td>
            <td>${notice.by || 'admin'}</td>
            <td>${notice.phone === 'all' ? 'সবাই' : notice.phone}</td>
            <td>${notice.message}</td>
            <td>
                <button class="btn-edit" onclick="openEditNotice(${originalIdx})">✏️ এডিট</button>
                <button class="btn-delete" onclick="deleteNotice(${originalIdx})">🗑️ ডিলিট</button>
            </td>
        </tr>`;
    });
    
    html += `</tbody></table>`;
    container.innerHTML = html;
}

function publishNotice() {
    if(!perms.accessNotice) { alert("আপনার এই কাজ করার অনুমতি নেই!"); return; }
    let msg = document.getElementById("noticeMsg").value.trim();
    if(!msg) { alert("বার্তা লিখুন!"); return; }
    let phone = document.getElementById("noticePhone").value.trim();
    if(phone && !validatePhone(phone)) { alert("সঠিক মোবাইল নম্বর দিন!"); return; }
    
    let notices = JSON.parse(localStorage.getItem("globalNotices")) || [];
    notices.push({ 
        phone: phone || "all", 
        message: msg, 
        date: new Date().toLocaleString(), 
        by: currentModerator.username, 
        id: Date.now() 
    });
    localStorage.setItem("globalNotices", JSON.stringify(notices));
    
    // লগ সেভ
    addActivityLog("নোটিশ পাবলিশ", `"${msg.substring(0, 50)}" ${phone ? '(মোবাইল: '+phone+')' : '(সবার জন্য)'}`);
    
    alert("✅ নোটিশ পাবলিশ হয়েছে!");
    document.getElementById("noticeMsg").value = "";
    document.getElementById("noticePhone").value = "";
    renderNoticesList();
}

function openEditNotice(index) {
    let notices = JSON.parse(localStorage.getItem("globalNotices")) || [];
    let notice = notices[index];
    if(notice) {
        document.getElementById("editNoticeIndex").value = index;
        document.getElementById("editNoticePhone").value = notice.phone === 'all' ? '' : notice.phone;
        document.getElementById("editNoticeMsg").value = notice.message;
        document.getElementById("editNoticeModal").style.display = "flex";
    }
}

function saveEditNotice() {
    let index = parseInt(document.getElementById("editNoticeIndex").value);
    let phone = document.getElementById("editNoticePhone").value.trim();
    let message = document.getElementById("editNoticeMsg").value.trim();
    
    if(!message) { alert("বার্তা লিখুন!"); return; }
    if(phone && !validatePhone(phone)) { alert("সঠিক মোবাইল নম্বর দিন!"); return; }
    
    let notices = JSON.parse(localStorage.getItem("globalNotices")) || [];
    let oldMessage = notices[index]?.message;
    
    if(index >= 0 && index < notices.length) {
        notices[index].phone = phone || "all";
        notices[index].message = message;
        notices[index].date = new Date().toLocaleString();
        notices[index].by = currentModerator.username;
        
        localStorage.setItem("globalNotices", JSON.stringify(notices));
        
        // লগ সেভ
        addActivityLog("নোটিশ এডিট", `"${oldMessage}" → "${message.substring(0, 50)}"`);
        
        renderNoticesList();
        closeNoticeModal();
        alert("✅ নোটিশ আপডেট হয়েছে!");
    }
}

function deleteNotice(index) {
    if(confirm("আপনি কি এই নোটিশটি ডিলিট করতে চান?")) {
        let notices = JSON.parse(localStorage.getItem("globalNotices")) || [];
        let deletedMsg = notices[index]?.message;
        notices.splice(index, 1);
        localStorage.setItem("globalNotices", JSON.stringify(notices));
        
        // লগ সেভ
        addActivityLog("নোটিশ ডিলিট", `"${deletedMsg?.substring(0, 50)}" ডিলিট করা হয়েছে`);
        
        renderNoticesList();
        alert("🗑️ নোটিশ ডিলিট হয়েছে!");
    }
}

function closeNoticeModal() {
    document.getElementById("editNoticeModal").style.display = "none";
}

// ============ ট্যুর প্ল্যান ফাংশন (লগ সহ) ============
function renderTourPlans() {
    let container = document.getElementById("tourPlansList");
    if(!container) return;
    
    let tours = JSON.parse(localStorage.getItem("tourPlansList")) || [];
    
    if(tours.length === 0) {
        container.innerHTML = "<p style='text-align:center; padding:20px;'>কোন ট্যুর প্ল্যান নেই</p>";
        return;
    }
    
    let html = `<table style="width:100%">
        <thead>
            <tr>
                <th>গন্তব্য</th>
                <th>তারিখ</th>
                <th>সময়কাল</th>
                <th>খরচ</th>
                <th>সদস্য সীমা</th>
                <th>অ্যাকশন</th>
            </tr>
        </thead>
        <tbody>`;
    
    tours.forEach((plan, idx) => {
        html += `<tr>
            <td>${plan.dest || 'N/A'}</td>
            <td>${plan.date || 'N/A'}</td>
            <td>${plan.duration || 'N/A'}</td>
            <td>৳ ${plan.cost || 'N/A'}</td>
            <td>${plan.limit || 'N/A'} জন</td>
            <td>
                <button class="btn-edit" onclick="openEditTour(${idx})">✏️ এডিট</button>
                <button class="btn-delete" onclick="deleteTour(${idx})">🗑️ ডিলিট</button>
            </td>
        </tr>`;
    });
    
    html += `</tbody></table>`;
    container.innerHTML = html;
}

function saveTourPlan() {
    if(!perms.accessTour) { alert("আপনার এই কাজ করার অনুমতি নেই!"); return; }
    
    let dest = document.getElementById("tourDest").value.trim();
    let date = document.getElementById("tourDate").value.trim();
    let duration = document.getElementById("tourDuration").value.trim();
    let cost = document.getElementById("tourCost").value.trim();
    let limit = document.getElementById("tourLimit").value.trim();
    
    if(!dest || !date) {
        alert("গন্তব্য ও তারিখ দিন!");
        return;
    }
    
    let tours = JSON.parse(localStorage.getItem("tourPlansList")) || [];
    tours.push({ 
        dest: dest, 
        date: date, 
        duration: duration, 
        cost: cost, 
        limit: limit, 
        id: Date.now(),
        createdBy: currentModerator.username
    });
    localStorage.setItem("tourPlansList", JSON.stringify(tours));
    
    // লগ সেভ
    addActivityLog("ট্যুর প্ল্যান যোগ", `${dest} (${date})`);
    
    alert("✅ ট্যুর প্ল্যান সেভ হয়েছে!");
    
    document.getElementById("tourDest").value = "";
    document.getElementById("tourDate").value = "";
    document.getElementById("tourDuration").value = "";
    document.getElementById("tourCost").value = "";
    document.getElementById("tourLimit").value = "";
    
    renderTourPlans();
}

function openEditTour(index) {
    let tours = JSON.parse(localStorage.getItem("tourPlansList")) || [];
    let plan = tours[index];
    if(plan) {
        document.getElementById("editTourIndex").value = index;
        document.getElementById("editTourDest").value = plan.dest;
        document.getElementById("editTourDate").value = plan.date;
        document.getElementById("editTourDuration").value = plan.duration || "";
        document.getElementById("editTourCost").value = plan.cost || "";
        document.getElementById("editTourLimit").value = plan.limit || "";
        document.getElementById("editTourModal").style.display = "flex";
    }
}

function saveEditTour() {
    let index = parseInt(document.getElementById("editTourIndex").value);
    let dest = document.getElementById("editTourDest").value.trim();
    let date = document.getElementById("editTourDate").value.trim();
    let duration = document.getElementById("editTourDuration").value.trim();
    let cost = document.getElementById("editTourCost").value.trim();
    let limit = document.getElementById("editTourLimit").value.trim();
    
    if(!dest || !date) {
        alert("গন্তব্য ও তারিখ দিন!");
        return;
    }
    
    let tours = JSON.parse(localStorage.getItem("tourPlansList")) || [];
    let oldDest = tours[index]?.dest;
    
    if(index >= 0 && index < tours.length) {
        tours[index] = {
            dest: dest,
            date: date,
            duration: duration,
            cost: cost,
            limit: limit,
            id: tours[index].id || Date.now(),
            createdBy: tours[index].createdBy || currentModerator.username,
            editedBy: currentModerator.username,
            editTime: new Date().toLocaleString()
        };
        localStorage.setItem("tourPlansList", JSON.stringify(tours));
        
        // লগ সেভ
        addActivityLog("ট্যুর প্ল্যান এডিট", `${oldDest} → ${dest}`);
        
        renderTourPlans();
        closeTourModal();
        alert("✅ ট্যুর প্ল্যান আপডেট হয়েছে!");
    }
}

function deleteTour(index) {
    if(confirm("আপনি কি এই ট্যুর প্ল্যানটি ডিলিট করতে চান?")) {
        let tours = JSON.parse(localStorage.getItem("tourPlansList")) || [];
        let deletedDest = tours[index]?.dest;
        tours.splice(index, 1);
        localStorage.setItem("tourPlansList", JSON.stringify(tours));
        
        // লগ সেভ
        addActivityLog("ট্যুর প্ল্যান ডিলিট", `${deletedDest} ডিলিট করা হয়েছে`);
        
        renderTourPlans();
        alert("🗑️ ট্যুর প্ল্যান ডিলিট হয়েছে!");
    }
}

function closeTourModal() {
    document.getElementById("editTourModal").style.display = "none";
}

function addNewUser() {
    if(!perms.accessAddUser) { alert("আপনার এই কাজ করার অনুমতি নেই!"); return; }
    let name = document.getElementById("newName").value.trim();
    let phone = document.getElementById("newPhone").value.trim();
    let dept = document.getElementById("newDept").value;
    let pass = document.getElementById("newPass").value.trim();
    
    if(!name || !phone || !pass) { alert("সব ঘর পূরণ করুন!"); return; }
    if(!validatePhone(phone)) { alert("সঠিক মোবাইল নম্বর দিন!"); return; }
    
    let users = JSON.parse(localStorage.getItem("users")) || [];
    if(users.find(u => u.phone === phone)) { alert("এই নম্বরটি আগে আছে!"); return; }
    
    users.push({ id: Date.now(), name, phone, dept, pass, deposit: 0, role: "user", status: "active", registerDate: new Date().toISOString() });
    localStorage.setItem("users", JSON.stringify(users));
    
    // লগ সেভ
    addActivityLog("নতুন ইউজার যোগ", `${name} (${phone})`);
    
    alert("✅ ইউজার তৈরি হয়েছে!");
    
    document.getElementById("newName").value = "";
    document.getElementById("newPhone").value = "";
    document.getElementById("newPass").value = "";
    if(perms.accessUsers) renderUsersList();
    updateStats();
}

function logout() { 
    localStorage.removeItem("loggedModerator"); 
    window.location.href = "moderator_login.html"; 
}

window.onclick = function(e) {
    let noticeModal = document.getElementById("editNoticeModal");
    if(e.target === noticeModal) closeNoticeModal();
    let tourModal = document.getElementById("editTourModal");
    if(e.target === tourModal) closeTourModal();
}

document.getElementById("newPhone")?.addEventListener("input", function(e) {
    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 11);
});
document.getElementById("noticePhone")?.addEventListener("input", function(e) {
    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 11);
});
document.getElementById("editNoticePhone")?.addEventListener("input", function(e) {
    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 11);
});

loadData();
</script>
