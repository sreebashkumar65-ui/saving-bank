<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Bank | লগইন পেজ</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }

        .circle-1 {
            width: 400px;
            height: 400px;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .circle-2 {
            width: 600px;
            height: 600px;
            bottom: -250px;
            right: -150px;
            animation-delay: 5s;
        }

        .circle-3 {
            width: 250px;
            height: 250px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 10s;
        }

        .circle-4 {
            width: 150px;
            height: 150px;
            top: 20%;
            right: 10%;
            animation-delay: 3s;
        }

        .circle-5 {
            width: 200px;
            height: 200px;
            bottom: 20%;
            left: 5%;
            animation-delay: 7s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-40px) rotate(10deg);
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            width: 100%;
            max-width: 480px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            animation: slideInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header Section */
        .card-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 45px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .logo-wrapper {
            position: relative;
            z-index: 1;
        }

        .logo-icon {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: pulse 2s infinite;
            backdrop-filter: blur(5px);
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 15px rgba(255, 255, 255, 0);
            }
        }

        .logo-icon i {
            font-size: 45px;
            color: white;
        }

        .card-header h1 {
            color: white;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .card-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 400;
        }
        
        .founder-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 10px;
        }

        /* Body Section */
        .card-body {
            padding: 45px 35px;
        }

        /* Form Groups */
        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            color: #94a3b8;
            font-size: 18px;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .input-field {
            width: 100%;
            padding: 15px 16px 15px 50px;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            font-size: 15px;
            font-family: 'Hind Siliguri', sans-serif;
            transition: all 0.3s ease;
            background: white;
            color: #1e293b;
        }

        .input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .input-field:focus + .input-icon {
            color: #667eea;
            transform: scale(1.1);
        }

        /* Password Toggle */
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .password-toggle:hover {
            color: #667eea;
        }

        /* Options */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 13px;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox span {
            color: #64748b;
        }

        .forgot-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .forgot-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Hind Siliguri', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .login-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        /* Register Link */
        .register-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .register-link p {
            color: #64748b;
            font-size: 14px;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .register-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        /* Alert Message */
        .alert {
            padding: 14px 18px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: none;
            align-items: center;
            gap: 12px;
            animation: slideInDown 0.3s ease;
            font-weight: 500;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.error {
            background: #fee2e2;
            border-left: 4px solid #ef4444;
            color: #991b1b;
            display: flex;
        }

        .alert.success {
            background: #dcfce7;
            border-left: 4px solid #10b981;
            color: #065f46;
            display: flex;
        }

        .alert i {
            font-size: 18px;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .loading-spinner {
            text-align: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-spinner p {
            color: white;
            font-size: 16px;
            font-weight: 500;
        }

        /* Social Login (Optional) */
        .social-login {
            margin-top: 25px;
            text-align: center;
        }

        .social-login p {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 15px;
            position: relative;
        }

        .social-login p::before,
        .social-login p::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: #e2e8f0;
        }

        .social-login p::before {
            left: 0;
        }

        .social-login p::after {
            right: 0;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-icon {
            width: 45px;
            height: 45px;
            background: #f1f5f9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .social-icon:hover {
            transform: translateY(-3px);
            background: #667eea;
        }

        .social-icon:hover i {
            color: white;
        }

        .social-icon i {
            font-size: 20px;
            color: #64748b;
            transition: color 0.3s ease;
        }

        /* Responsive */
        @media (max-width: 520px) {
            .card-body {
                padding: 30px 25px;
            }
            
            .card-header {
                padding: 35px 25px;
            }
            
            .logo-icon {
                width: 70px;
                height: 70px;
            }
            
            .logo-icon i {
                font-size: 35px;
            }
            
            .card-header h1 {
                font-size: 26px;
            }
            
            .input-field {
                padding: 13px 16px 13px 45px;
                font-size: 14px;
            }
            
            .options {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
        <div class="circle circle-4"></div>
        <div class="circle circle-5"></div>
    </div>

    <div class="container">
        <div class="glass-card">
            <div class="card-header">
                <div class="logo-wrapper">
                    <div class="logo-icon">
                        <i class="fas fa-building-columns"></i>
                    </div>
                    <h1>Savings Bank</h1>
                    <p>লগইন করুন আপনার অ্যাকাউন্টে</p>
                    <div class="founder-text">Founder by Sreebash Kumar</div>
                </div>
            </div>

            <div class="card-body">
                <div id="alertMessage" class="alert"></div>

                <form id="loginForm">
                    <div class="input-group">
                        <label>মোবাইল নম্বর</label>
                        <div class="input-wrapper">
                            <i class="fas fa-mobile-alt input-icon"></i>
                            <input type="tel" id="loginPhone" class="input-field" placeholder="01XXXXXXXXX" maxlength="11" autocomplete="off">
                        </div>
                    </div>

                    <div class="input-group">
                        <label>পাসওয়ার্ড</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="loginPassword" class="input-field" placeholder="পাসওয়ার্ড">
                            <i class="fas fa-eye password-toggle" onclick="togglePassword()"></i>
                        </div>
                    </div>

                    <div class="options">
                        <label class="checkbox">
                            <input type="checkbox" id="rememberMe"> 
                            <span>আমাকে মনে রাখুন</span>
                        </label>
                        <a href="#" class="forgot-link" onclick="forgotPassword()">পাসওয়ার্ড ভুলে গেছেন?</a>
                    </div>

                    <button type="submit" class="login-btn">
                        <i class="fas fa-sign-in-alt"></i> লগইন করুন
                    </button>

                    <div class="register-link">
                        <p>অ্যাকাউন্ট নেই? <a href="#" onclick="showRegisterModal()">রেজিস্ট্রেশন করুন</a></p>
                    </div>

                    <div class="social-login">
                        <p>অথবা লগইন করুন</p>
                        <div class="social-icons">
                            <div class="social-icon" onclick="socialLogin('google')">
                                <i class="fab fa-google"></i>
                            </div>
                            <div class="social-icon" onclick="socialLogin('facebook')">
                                <i class="fab fa-facebook-f"></i>
                            </div>
                            <div class="social-icon" onclick="socialLogin('github')">
                                <i class="fab fa-github"></i>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>লগইন হচ্ছে...</p>
        </div>
    </div>

    <!-- Registration Modal -->
    <div id="registerModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center;">
        <div style="background: white; border-radius: 30px; max-width: 500px; width: 90%; padding: 40px; position: relative; animation: slideInUp 0.3s ease;">
            <div style="position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 24px; color: #64748b;" onclick="closeRegisterModal()">&times;</div>
            <h2 style="color: #1e293b; margin-bottom: 25px; text-align: center;">Savings Bank এ রেজিস্ট্রেশন করুন</h2>
            <form id="registerForm">
                <div class="input-group">
                    <label>পূর্ণ নাম</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="regName" class="input-field" placeholder="আপনার নাম" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>মোবাইল নম্বর</label>
                    <div class="input-wrapper">
                        <i class="fas fa-mobile-alt input-icon"></i>
                        <input type="tel" id="regPhone" class="input-field" placeholder="01XXXXXXXXX" maxlength="11" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>বিভাগ নির্বাচন</label>
                    <div class="input-wrapper">
                        <i class="fas fa-layer-group input-icon"></i>
                        <select id="regDept" class="input-field" style="padding: 15px 16px 15px 50px;">
                            <option value="ট্যুর-শেয়ার">🏝️ ট্যুর-শেয়ার</option>
                            <option value="চিকিৎসা-শেয়ার">🏥 চিকিৎসা-শেয়ার</option>
                            <option value="বাৎসরিক-শেয়ার">📆 বাৎসরিক-শেয়ার</option>
                        </select>
                    </div>
                </div>
                <div class="input-group">
                    <label>পাসওয়ার্ড</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="regPassword" class="input-field" placeholder="পাসওয়ার্ড (৪+ অক্ষর)" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>পাসওয়ার্ড নিশ্চিত করুন</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="regConfirmPassword" class="input-field" placeholder="পাসওয়ার্ড নিশ্চিত করুন" required>
                    </div>
                </div>
                <button type="submit" class="login-btn" style="margin-top: 10px;">রেজিস্ট্রেশন করুন</button>
            </form>
        </div>
    </div>

    <script>
        // Toggle Password Visibility
        function togglePassword() {
            const passwordInput = document.getElementById('loginPassword');
            const toggleIcon = document.querySelector('.password-toggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Show Alert Message
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${message}`;
            alertDiv.className = `alert ${type}`;
            
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 3000);
        }

        // Show Loading
        function showLoading() {
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        // Hide Loading
        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // Social Login (Demo)
        function socialLogin(provider) {
            showAlert(`${provider} দিয়ে লগইন সুবিধা শীঘ্রই আসছে!`, 'error');
        }

        // Forgot Password
        function forgotPassword() {
            showAlert('পাসওয়ার্ড রিসেট লিংক আপনার মোবাইল নম্বরে পাঠানো হবে!', 'success');
        }

        // Show Register Modal
        function showRegisterModal() {
            document.getElementById('registerModal').style.display = 'flex';
        }

        // Close Register Modal
        function closeRegisterModal() {
            document.getElementById('registerModal').style.display = 'none';
            document.getElementById('registerForm').reset();
        }

        // Remember Me Function
        function saveCredentials(phone, password) {
            if (document.getElementById('rememberMe').checked) {
                localStorage.setItem('rememberedPhone', phone);
                localStorage.setItem('rememberedPassword', password);
                localStorage.setItem('rememberMe', 'true');
            } else {
                localStorage.removeItem('rememberedPhone');
                localStorage.removeItem('rememberedPassword');
                localStorage.setItem('rememberMe', 'false');
            }
        }

        function loadCredentials() {
            if (localStorage.getItem('rememberMe') === 'true') {
                const phone = localStorage.getItem('rememberedPhone');
                const password = localStorage.getItem('rememberedPassword');
                if (phone && password) {
                    document.getElementById('loginPhone').value = phone;
                    document.getElementById('loginPassword').value = password;
                    document.getElementById('rememberMe').checked = true;
                }
            }
        }

        // Validate Bangladesh Mobile Number
        function validateBangladeshPhone(phone) {
            const phoneRegex = /^01[3-9]\d{8}$/;
            return phoneRegex.test(phone);
        }

        // Initialize default admin if no users exist
        function initializeDefaultAdmin() {
            let users = JSON.parse(localStorage.getItem('users')) || [];
            if (users.length === 0) {
                users = [{
                    id: 1,
                    name: "সাভিংস ব্যাংক অ্যাডমিন",
                    phone: "01815151122",
                    dept: "Savings Bank",
                    pass: "admin",
                    deposit: 0,
                    role: "admin",
                    status: "active",
                    registerDate: new Date().toISOString()
                }];
                localStorage.setItem('users', JSON.stringify(users));
            }
        }

        // Registration Function
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const dept = document.getElementById('regDept').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            
            if (!name || !phone || !password || !confirmPassword) {
                showAlert('সব ঘর পূরণ করুন!', 'error');
                return;
            }
            
            if (!validateBangladeshPhone(phone)) {
                showAlert('সঠিক বাংলাদেশি মোবাইল নম্বর দিন (01XXXXXXXXX)!', 'error');
                return;
            }
            
            if (password.length < 4) {
                showAlert('পাসওয়ার্ড কমপক্ষে ৪ অক্ষরের হতে হবে!', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showAlert('পাসওয়ার্ড দুটি মিলছে না!', 'error');
                return;
            }
            
            // Get existing users
            let users = JSON.parse(localStorage.getItem('users')) || [];
            
            // Check if phone already exists
            if (users.find(u => u.phone === phone)) {
                showAlert('এই মোবাইল নম্বরটি already রেজিস্ট্রেশন করা আছে!', 'error');
                return;
            }
            
            // Add new user
            const newUser = {
                id: Date.now(),
                name: name,
                phone: phone,
                dept: dept,
                pass: password,
                deposit: 0,
                role: "user",
                status: "active",
                registerDate: new Date().toISOString()
            };
            
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));
            
            showAlert('রেজিস্ট্রেশন সফল! এখন লগইন করুন।', 'success');
            closeRegisterModal();
            
            // Auto fill phone number
            document.getElementById('loginPhone').value = phone;
            document.getElementById('loginPassword').value = '';
        });

        // Login Form Submit
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            
            // Validation
            if (!phone || !password) {
                showAlert('সব ঘর পূরণ করুন!', 'error');
                return;
            }
            
            if (!validateBangladeshPhone(phone)) {
                showAlert('সঠিক বাংলাদেশি মোবাইল নম্বর দিন (01XXXXXXXXX)!', 'error');
                return;
            }
            
            // Show loading
            showLoading();
            
            // Initialize default admin if needed
            initializeDefaultAdmin();
            
            // Get users from localStorage
            let users = JSON.parse(localStorage.getItem('users')) || [];
            
            // Find user
            const user = users.find(u => u.phone === phone && u.pass === password);
            
            setTimeout(() => {
                if (user) {
                    // Save credentials if remember me checked
                    saveCredentials(phone, password);
                    
                    // Save logged user
                    localStorage.setItem('loggedUser', JSON.stringify(user));
                    
                    showAlert('লগইন সফল! রিডাইরেক্ট হচ্ছে...', 'success');
                    
                    setTimeout(() => {
                        if (user.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'user.html';
                        }
                    }, 1500);
                } else {
                    showAlert('মোবাইল নম্বর বা পাসওয়ার্ড ভুল!', 'error');
                    hideLoading();
                }
            }, 500);
        });

        // Initialize default admin on page load
        initializeDefaultAdmin();
        
        // Check if already logged in
        const loggedUser = JSON.parse(localStorage.getItem('loggedUser'));
        if (loggedUser) {
            if (loggedUser.role === 'admin') {
                window.location.href = 'admin.html';
            } else if (loggedUser.role === 'user') {
                window.location.href = 'user.html';
            }
        }
        
        // Load saved credentials
        loadCredentials();

        // Add input animation effects
        const inputs = document.querySelectorAll('.input-field');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.parentElement.classList.add('focused');
            });
            
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.parentElement.parentElement.classList.remove('focused');
                }
            });
        });

        // Phone number validation on input
        document.getElementById('loginPhone').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 11);
        });
        
        document.getElementById('regPhone').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 11);
        });

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('registerModal');
            if (event.target === modal) {
                closeRegisterModal();
            }
        }
    </script>
</body>
</html>
