<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Savings Bank | লগইন</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            max-width: 450px;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .card-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 40px 30px;
            text-align: center;
        }
        .logo-icon {
            width: 80px; height: 80px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
        }
        .logo-icon i { font-size: 45px; color: white; }
        .card-header h1 { color: white; font-size: 28px; margin-bottom: 5px; }
        .card-header p { color: rgba(255,255,255,0.9); font-size: 14px; }
        .founder-text { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 10px; }
        .card-body { padding: 35px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 14px; font-weight: 600; color: #1e293b; margin-bottom: 8px; }
        .input-wrapper { position: relative; }
        .input-wrapper i:first-child { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .input-wrapper input {
            width: 100%; padding: 15px 16px 15px 48px;
            border: 2px solid #e2e8f0; border-radius: 20px;
            font-size: 16px; font-family: inherit;
            transition: 0.3s;
        }
        .input-wrapper input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .password-toggle { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8; }
        .options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-size: 14px; flex-wrap: wrap; gap: 10px; }
        .checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .forgot-link { color: #667eea; text-decoration: none; }
        .login-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 20px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: 0.3s; margin-bottom: 20px;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
        .register-link { text-align: center; padding-top: 20px; border-top: 1px solid #e2e8f0; }
        .register-link a { color: #667eea; text-decoration: none; font-weight: 600; }
        .alert { padding: 12px; border-radius: 14px; margin-bottom: 20px; display: none; align-items: center; gap: 10px; }
        .alert.error { background: #fee2e2; color: #991b1b; display: flex; border-left: 4px solid #ef4444; }
        .alert.success { background: #dcfce7; color: #065f46; display: flex; border-left: 4px solid #10b981; }
        .loading-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center; z-index: 9999;
        }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); align-items: center; justify-content: center;
            z-index: 10000; padding: 20px;
        }
        .modal-content {
            background: white; border-radius: 28px; padding: 30px;
            max-width: 450px; width: 100%; max-height: 90vh; overflow-y: auto;
        }
        .modal-content h2 { text-align: center; margin-bottom: 20px; color: #1e293b; }
        .modal-buttons { display: flex; gap: 12px; margin-top: 24px; }
        .modal-buttons button { flex:1; padding: 14px; border-radius: 14px; border: none; cursor: pointer; font-weight: 600; }
        .save-btn { background: #10b981; color: white; }
        .cancel-btn { background: #e2e8f0; color: #1e293b; }
        @media (max-width: 480px) { .card-body { padding: 25px; } .logo-icon { width: 70px; height: 70px; } .logo-icon i { font-size: 35px; } }
    </style>
</head>
<body>
<div class="login-card">
    <div class="card-header">
        <div class="logo-icon"><i class="fas fa-building-columns"></i></div>
        <h1>Savings Bank</h1>
        <p>লগইন করুন আপনার অ্যাকাউন্টে</p>
        <div class="founder-text">Founder by Sreebash Kumar</div>
    </div>
    <div class="card-body">
        <div id="alertMessage" class="alert"></div>
        <form id="loginForm">
            <div class="input-group">
                <label>মোবাইল নম্বর</label>
                <div class="input-wrapper">
                    <i class="fas fa-mobile-alt"></i>
                    <input type="tel" id="loginPhone" placeholder="01XXXXXXXXX" maxlength="11" autocomplete="off">
                </div>
            </div>
            <div class="input-group">
                <label>পাসওয়ার্ড</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড">
                    <i class="fas fa-eye password-toggle" onclick="togglePassword()"></i>
                </div>
            </div>
            <div class="options">
                <label class="checkbox"><input type="checkbox" id="rememberMe"> <span>আমাকে মনে রাখুন</span></label>
                <a href="#" class="forgot-link" onclick="forgotPassword()">পাসওয়ার্ড ভুলে গেছেন?</a>
            </div>
            <button type="submit" class="login-btn">লগইন করুন</button>
            <div class="register-link"><p>অ্যাকাউন্ট নেই? <a href="#" onclick="showRegisterModal()">রেজিস্ট্রেশন করুন</a></p></div>
        </form>
    </div>
</div>
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>
<div id="registerModal" class="modal">
    <div class="modal-content">
        <div style="text-align:right; cursor:pointer; font-size:24px;" onclick="closeRegisterModal()">&times;</div>
        <h2>নতুন অ্যাকাউন্ট</h2>
        <form id="registerForm">
            <div class="input-group"><label>পূর্ণ নাম</label><div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="regName" placeholder="আপনার নাম" required></div></div>
            <div class="input-group"><label>মোবাইল নম্বর</label><div class="input-wrapper"><i class="fas fa-mobile-alt"></i><input type="tel" id="regPhone" placeholder="01XXXXXXXXX" maxlength="11" required></div></div>
            <div class="input-group"><label>বিভাগ নির্বাচন</label><div class="input-wrapper"><i class="fas fa-layer-group"></i><select id="regDept" style="width:100%; padding:15px; border-radius:16px; border:2px solid #e2e8f0;"><option value="ট্যুর-শেয়ার">🏝️ ট্যুর-শেয়ার</option><option value="চিকিৎসা-শেয়ার">🏥 চিকিৎসা-শেয়ার</option><option value="বাৎসরিক-শেয়ার">📆 বাৎসরিক-শেয়ার</option></select></div></div>
            <div class="input-group"><label>পাসওয়ার্ড</label><div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="regPassword" placeholder="পাসওয়ার্ড (৪+ অক্ষর)" required></div></div>
            <div class="input-group"><label>পাসওয়ার্ড নিশ্চিত করুন</label><div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="regConfirmPassword" placeholder="পাসওয়ার্ড নিশ্চিত করুন" required></div></div>
            <button type="submit" class="login-btn" style="margin-top:10px;">রেজিস্ট্রেশন করুন</button>
        </form>
    </div>
</div>
<script>
    function togglePassword() { let pwd=document.getElementById('loginPassword'); let icon=document.querySelector('.password-toggle'); if(pwd.type==='password'){ pwd.type='text'; icon.classList.remove('fa-eye'); icon.classList.add('fa-eye-slash'); } else { pwd.type='password'; icon.classList.remove('fa-eye-slash'); icon.classList.add('fa-eye'); } }
    function showAlert(msg,type){ let d=document.getElementById('alertMessage'); d.innerHTML=`<i class="fas ${type==='error'?'fa-exclamation-circle':'fa-check-circle'}"></i> ${msg}`; d.className=`alert ${type}`; setTimeout(()=>d.style.display='none',3000); }
    function showLoading(){ document.getElementById('loadingOverlay').style.display='flex'; }
    function hideLoading(){ document.getElementById('loadingOverlay').style.display='none'; }
    function forgotPassword(){ showAlert('পাসওয়ার্ড রিসেট লিংক পাঠানো হবে!','success'); }
    function showRegisterModal(){ document.getElementById('registerModal').style.display='flex'; }
    function closeRegisterModal(){ document.getElementById('registerModal').style.display='none'; document.getElementById('registerForm').reset(); }
    function saveCredentials(phone,pwd){ if(document.getElementById('rememberMe').checked){ localStorage.setItem('rememberedPhone',phone); localStorage.setItem('rememberedPassword',pwd); localStorage.setItem('rememberMe','true'); } else { localStorage.removeItem('rememberedPhone'); localStorage.removeItem('rememberedPassword'); localStorage.setItem('rememberMe','false'); } }
    function loadCredentials(){ if(localStorage.getItem('rememberMe')==='true'){ let phone=localStorage.getItem('rememberedPhone'); let pwd=localStorage.getItem('rememberedPassword'); if(phone && pwd){ document.getElementById('loginPhone').value=phone; document.getElementById('loginPassword').value=pwd; document.getElementById('rememberMe').checked=true; } } }
    function validatePhone(p){ return /^01[3-9]\d{8}$/.test(p); }
    function initDefaultAdmin(){ let users=JSON.parse(localStorage.getItem('users'))||[]; if(users.length===0){ users=[{ id:1, name:"Savings Bank Admin", phone:"01815151122", dept:"Savings Bank", pass:"admin", deposit:0, role:"admin", status:"active", registerDate:new Date().toISOString() }]; localStorage.setItem('users',JSON.stringify(users)); } }
    document.getElementById('registerForm').addEventListener('submit',function(e){ e.preventDefault(); let name=document.getElementById('regName').value.trim(); let phone=document.getElementById('regPhone').value.trim(); let dept=document.getElementById('regDept').value; let pwd=document.getElementById('regPassword').value; let cpwd=document.getElementById('regConfirmPassword').value; if(!name||!phone||!pwd||!cpwd){ showAlert('সব ঘর পূরণ করুন!','error'); return; } if(!validatePhone(phone)){ showAlert('সঠিক মোবাইল নম্বর দিন!','error'); return; } if(pwd.length<4){ showAlert('পাসওয়ার্ড ৪+ অক্ষর হতে হবে!','error'); return; } if(pwd!==cpwd){ showAlert('পাসওয়ার্ড মিলছে না!','error'); return; } let users=JSON.parse(localStorage.getItem('users'))||[]; if(users.find(u=>u.phone===phone)){ showAlert('এই নম্বর already আছে!','error'); return; } let newUser={ id:Date.now(), name, phone, dept, pass:pwd, deposit:0, role:"user", status:"active", registerDate:new Date().toISOString() }; users.push(newUser); localStorage.setItem('users',JSON.stringify(users)); showAlert('রেজিস্ট্রেশন সফল! লগইন করুন।','success'); closeRegisterModal(); document.getElementById('loginPhone').value=phone; document.getElementById('loginPassword').value=''; });
    document.getElementById('loginForm').addEventListener('submit',function(e){ e.preventDefault(); if(this.submitted) return; this.submitted=true; let phone=document.getElementById('loginPhone').value.trim(); let pwd=document.getElementById('loginPassword').value.trim(); if(!phone||!pwd){ showAlert('সব ঘর পূরণ করুন!','error'); this.submitted=false; return; } if(!validatePhone(phone)){ showAlert('সঠিক মোবাইল নম্বর দিন!','error'); this.submitted=false; return; } showLoading(); initDefaultAdmin(); let users=JSON.parse(localStorage.getItem('users'))||[]; let user=users.find(u=>u.phone===phone && u.pass===pwd); setTimeout(()=>{ if(user){ saveCredentials(phone,pwd); localStorage.setItem('loggedUser',JSON.stringify(user)); showAlert('লগইন সফল!','success'); setTimeout(()=>{ hideLoading(); if(user.role==='admin') window.location.href='admin.html'; else window.location.href='user.html'; },500); } else { showAlert('মোবাইল বা পাসওয়ার্ড ভুল!','error'); hideLoading(); document.getElementById('loginForm').submitted=false; } },500); });
    let loggedUser=JSON.parse(localStorage.getItem('loggedUser')); if(loggedUser){ if(loggedUser.role==='admin') window.location.href='admin.html'; else if(loggedUser.role==='user') window.location.href='user.html'; }
    loadCredentials(); document.getElementById('loginPhone').addEventListener('input',function(e){ this.value=this.value.replace(/[^0-9]/g,'').slice(0,11); }); document.getElementById('regPhone').addEventListener('input',function(e){ this.value=this.value.replace(/[^0-9]/g,'').slice(0,11); }); window.onclick=function(e){ if(e.target===document.getElementById('registerModal')) closeRegisterModal(); }
</script>
</body>
</html>
