<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Bank | মডারেটর লগইন</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #0f2b3d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo i { font-size: 60px; color: #1e3a5f; }
        h2 { text-align: center; color: #1e293b; margin-bottom: 10px; }
        .founder-text { text-align: center; font-size: 11px; color: #64748b; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #1e293b; }
        .form-group input { width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 16px; font-size: 14px; font-family: 'Hind Siliguri', sans-serif; transition: all 0.3s ease; }
        .form-group input:focus { outline: none; border-color: #1e3a5f; box-shadow: 0 0 0 3px rgba(30,58,95,0.1); }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #1e3a5f, #0f2b3d); color: white; border: none; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(30,58,95,0.4); }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #1e3a5f; text-decoration: none; }
        .alert { padding: 12px; border-radius: 12px; margin-bottom: 20px; display: none; }
        .alert.error { background: #fee2e2; color: #991b1b; display: block; }
        .alert.success { background: #dcfce7; color: #065f46; display: block; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo"><i class="fas fa-building-columns"></i></div>
        <h2>Savings Bank</h2>
        <div class="founder-text">Founder by Sreebash Kumar</div>
        <div id="alertMsg" class="alert"></div>
        <form id="moderatorLoginForm">
            <div class="form-group"><label>👤 ইউজারনেম</label><input type="text" id="modUsername" placeholder="ইউজারনেম দিন" required></div>
            <div class="form-group"><label>🔑 পাসওয়ার্ড</label><input type="password" id="modPassword" placeholder="পাসওয়ার্ড দিন" required></div>
            <button type="submit">লগইন করুন</button>
        </form>
        <div class="back-link"><a href="index.html">◀ মূল লগইন পেজে ফিরে যান</a></div>
    </div>
    <script>
        document.getElementById("moderatorLoginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            let username = document.getElementById("modUsername").value.trim();
            let password = document.getElementById("modPassword").value.trim();
            let moderators = JSON.parse(localStorage.getItem("moderatorList")) || [];
            let moderator = moderators.find(m => m.username === username && m.pass === password);
            if(moderator) {
                localStorage.setItem("loggedModerator", JSON.stringify(moderator));
                window.location.href = "moderator_panel.html";
            } else {
                document.getElementById("alertMsg").innerHTML = "❌ ভুল ইউজারনেম বা পাসওয়ার্ড!";
                document.getElementById("alertMsg").className = "alert error";
                setTimeout(() => { document.getElementById("alertMsg").style.display = "none"; }, 3000);
            }
        });
    </script>
</body>
</html>
